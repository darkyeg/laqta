name: Nix

# Builds the flake package and, when the CACHIX_AUTH_TOKEN secret is set, pushes it to the
# Cachix cache named by the CACHIX_CACHE repository variable, so Nix users download the build
# instead of compiling it.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - flake.nix
      - flake.lock
      - nix/**
      - Cargo.toml
      - Cargo.lock
      - apps/**
      - crates/**
      - vendor/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: nix build (x86_64-linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        if: vars.CACHIX_CACHE != ''
        with:
          name: ${{ vars.CACHIX_CACHE }}
          # Without the token (forks, pull requests from forks) the cache is only read.
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix flake check --no-build
      - run: nix build .#laqta --print-build-logs
      - run: ./result/bin/laqta --version
