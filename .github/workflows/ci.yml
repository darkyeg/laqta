name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # The platform contract tests drive the screen and clipboard; CI gives them a virtual display.
  LAQTA_CONTRACT: "1"
  LINUX_DEPS: >-
    libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libx11-xcb-dev libxcb1-dev
    libfontconfig-dev libfreetype-dev libdbus-1-dev libpipewire-0.3-dev libclang-dev pkg-config
    libegl-dev libgbm-dev libdrm-dev

jobs:
  lint:
    name: Lint (fmt, clippy, deny, dependency rules)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with: { tool: "cargo-deny@0.20.2" }
      - run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo deny check
      - run: cargo xtask check-deps
      - run: cargo xtask check-deps --self-test

  test-x11:
    name: Test (Linux, X11)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with: { tool: "cargo-nextest@0.9.151" }
      - run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS xvfb x11-xserver-utils ffmpeg
      - name: Start a virtual X display
        run: |
          # -noreset keeps the root colour set below after the last client disconnects.
          Xvfb :99 -screen 0 1920x1080x24 -noreset &
          sleep 2
          DISPLAY=:99 xsetroot -solid "#336699"
      - run: cargo nextest run --workspace --profile ci
        env: { DISPLAY: ":99" }
      - name: Keep the test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-linux-x11
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
      - run: cargo test --doc --workspace
        env: { DISPLAY: ":99" }

  test-wayland:
    name: Test (Linux, Wayland)
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with: { tool: "cargo-nextest@0.9.151" }
      - run: sudo apt-get update && sudo apt-get install -y sway swaybg $LINUX_DEPS
      - name: Start headless sway
        run: |
          export XDG_RUNTIME_DIR=$(mktemp -d)
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          WLR_BACKENDS=headless WLR_LIBINPUT_NO_DEVICES=1 sway -c ci/sway.conf &
          sleep 3
          echo "WAYLAND_DISPLAY=$(ls $XDG_RUNTIME_DIR | grep -m1 '^wayland-[0-9]*$')" >> "$GITHUB_ENV"
      - run: cargo nextest run -p laqta-platform-linux --profile ci
      - name: Keep the test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-linux-wayland
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore

  test-windows:
    name: Test (Windows)
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      VCPKGRS_TRIPLET: x64-windows-static-md
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      # SQLite for laqta-library (ADR 026).
      - run: vcpkg install "sqlite3[fts5]:x64-windows-static-md"
      - run: echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
      - uses: taiki-e/install-action@v2
        with: { tool: "cargo-nextest@0.9.151" }
      # The lint job runs on Linux, so the Windows-only code is linted here.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo nextest run --workspace --profile ci
      - name: Keep the test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-windows
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
